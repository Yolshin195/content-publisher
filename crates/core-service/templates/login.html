<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход · Content Publisher</title>
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="grid min-h-screen place-items-center p-4">
    <main class="w-full max-w-sm">
        <div class="mb-6 flex items-center justify-center gap-2.5">
            <span class="grid size-10 place-items-center rounded-xl bg-accent text-white shadow-sm">
                <svg class="size-5"><use href="/static/icons.svg#i-send"/></svg>
            </span>
            <span class="text-lg font-semibold tracking-tight">Content Publisher</span>
        </div>
        <form method="post" action="/login" class="card space-y-4 p-6">
            <input type="hidden" name="next" value="{{ next }}">
            <div>
                <label class="label" for="password">Пароль</label>
                <input id="password" name="password" type="password" class="input" autocomplete="current-password" autofocus required>
            </div>
            {% if error %}
            <p class="flex items-center gap-1.5 text-sm text-danger" role="alert"><svg class="size-4"><use href="/static/icons.svg#i-alert"/></svg> Неверный пароль</p>
            {% endif %}
            {% if !auth_enabled %}
            <p class="text-xs text-ink-3">Авторизация выключена (не задан ADMIN_PASSWORD) — можно войти с любым паролем.</p>
            {% endif %}
            <button class="btn btn-primary w-full">Войти</button>
        </form>
    </main>
</body>
</html>
